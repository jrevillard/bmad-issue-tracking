# story-track-review plugin for bmad-loop.
#
# Injects an LLM session at `post_review_result` (after review completes).
# Commits review modifications, pushes, waits for CI, writes ci-status.json,
# and mirrors the story to its GitLab/GitHub issue (status label, comment).
#
# This runs ONLY when review completes. Stories that skip review don't trigger
# this plugin (but story-track-dev still runs at post_dev_phase).
#
# blocking = true: if this session does not complete (push failed, CI timeout),
# the unit is deferred — review changes must be pushed and CI-verified.

[plugin]
name = "story-track-review"
version = "1.0.0"
api_version = 1
description = "Post-review: commit review changes, push, wait CI, track issue. Runs only if review completes."
author = "bmad-issue-tracking"

[workflows.story-track-review]
stage = "post_review_result"
role = "dev"
prompt = "{scripts}/story-track-review-prompt.md"
blocking = true

[[settings]]
key = "story_track_review_enabled"
type = "bool"
default = true
label = "Enable story-track-review"
help = "Run the post-review workflow: commit, push, wait CI, track issue."

[[settings]]
key = "story_track_review_blocking"
type = "bool"
default = true
label = "Block on failure"
help = "If true, defer the story when story-track-review fails."
