# Issue Tracking override for bmad-build (manual flow)
# Routes the on_complete hook to the interactive dispatcher, which reads the spec
# status and dispatches to the right phase of post-dev-complete (push + wait CI +
# update issue + post comment). allow_merge=true enables the optional MR merge
# prompt in review-finish (interactive flow). bmad-build-auto uses the non-interactive
# dispatcher (post-build-dispatch.yaml).

[workflow]

# Scalar: executed when the workflow reaches its final step,
# after the story implementation is complete and status is updated. Override wins.
# Leave empty for no custom post-completion behavior.

on_complete = """
Read `_bmad/_config/custom/bmad-workflow-lang.md` for the workflow language specification, then execute `_bmad/_config/custom/workflows/common/post-build-dispatch-interactive.yaml`.
"""