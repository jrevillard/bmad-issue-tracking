# Issue Tracking override for bmad-code-review.
# Delegates to common/post-dev-complete-review-finish.yaml.
# Superseded by bmad-build + bmad-build-auto overrides — kept for retrocompat.

[workflow]

activation_steps_append = [
  "Read `_bmad/_config/custom/bmad-workflow-lang.md` for the workflow language specification, then execute `_bmad/_config/custom/workflows/code-review/activation.yaml`.",
]

on_complete = """
Read `_bmad/_config/custom/bmad-workflow-lang.md` for the workflow language specification, then execute `_bmad/_config/custom/workflows/common/post-dev-complete-review-finish.yaml`.
"""