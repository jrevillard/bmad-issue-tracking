# common/ensure-mr.yaml
#
# Purpose: Ensures a trace MR/PR exists for the source branch — finds it by source
#          branch, creates it if missing with the caller-supplied title, description
#          body, and draft flag. Reused by both story-mode callers
#          (post-dev-complete phases) and PRD-mode callers (bmad-prd/complete.yaml,
#          create-prd/complete.yaml).
# Input variables:
#   - mr_repo: full repo path (gitlab "host/group/project"; github "host/owner/project")
#   - source_branch: branch with the work to merge (PRD: prd_branch; story: story_branch = prd_branch/story_key)
#   - target_branch: branch to merge into (PRD: default_branch; story: prd_branch)
#   - mr_title: title shown in the MR (story callers typically "Story N.M: Title" or
#               "Story KEY — bmad-build-converge"; PRD callers "PRD: {prd_key}")
#   - mr_description_file: path to a file containing the description body — caller
#               is responsible for assembling the cross-platform issue reference
#               ("Sprint key: ...\n\nRelated to #N" for story atomic; "Closes #N" for PRD)
#   - mr_draft: "true" to create as draft, "false" for ready-to-merge (default "false")
# Output variables: (none — call common/find-mr after to resolve mr_iid if needed)
# Side effects: creates the MR/PR on the tracker if not found

# Read description body from caller-supplied file (single source of truth — caller
# composes the cross-platform reference; atomic just transports the text).
- RUN: cat {mr_description_file}
  STORE: description_body
# Check if an MR/PR already exists for this source branch (via atomic find-mr)
- INCLUDE: common/find-mr
- CHECK: empty mr_iid
  TRUE:
    # No MR exists — create the trace MR (caller-supplied title/description/draft).
    # --draft flag is conditional: emit only when mr_draft eq "true" so story callers
    # (default mr_draft="false") keep a byte-identical command shape to the pre-refactor
    # inline code.
    - CHECK: git_platform eq "gitlab"
      TRUE:
        - CHECK: mr_draft eq "true"
          TRUE:
            - RUN: glab mr create --title "{mr_title}" --description "{description_body}" --target-branch {target_branch} --source-branch {source_branch} --draft -R "{mr_repo}" 2>&1 | tee /dev/stderr | grep -oE 'https://[^ ]+' | head -1
              STORE: mr_url
          FALSE:
            - RUN: glab mr create --title "{mr_title}" --description "{description_body}" --target-branch {target_branch} --source-branch {source_branch} -R "{mr_repo}" 2>&1 | tee /dev/stderr | grep -oE 'https://[^ ]+' | head -1
              STORE: mr_url
      FALSE:
        - CHECK: mr_draft eq "true"
          TRUE:
            - RUN: gh pr create --title "{mr_title}" --body "{description_body}" --base {target_branch} --head {source_branch} --draft -R "{mr_repo}" 2>&1 | grep -oE 'https://github\.com/[^ ]+/pull/[0-9]+' | head -1
              STORE: mr_url
          FALSE:
            - RUN: gh pr create --title "{mr_title}" --body "{description_body}" --base {target_branch} --head {source_branch} -R "{mr_repo}" 2>&1 | grep -oE 'https://github\.com/[^ ]+/pull/[0-9]+' | head -1
              STORE: mr_url
